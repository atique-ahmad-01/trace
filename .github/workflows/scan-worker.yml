name: Scan worker

# Runs scans and other background jobs for the hosted API. Vercel cannot run background work, so
# with REDIS_URL set the API queues jobs in Redis (RQ) and this workflow drains the queue every
# 5 minutes using the backend image, which has all four scanners.
#
# Repository secrets: DATABASE_URL, SECRET_KEY, JWT_SECRET_KEY, REDIS_URL (same values as the
# Vercel API project). Worker output is discarded because logs of a public repository are public.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-worker
  cancel-in-progress: false

jobs:
  work:
    if: github.repository == 'atique-ahmad-01/trace'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      - name: Check the queue
        id: queue
        run: |
          pip install --quiet redis==5.2.1
          n=$(python3 -c "import os, redis; print(redis.Redis.from_url(os.environ['REDIS_URL']).llen('rq:queue:trace'))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.pending != '0'

      - uses: docker/setup-buildx-action@v3
        if: steps.queue.outputs.pending != '0'

      - name: Build the backend image
        if: steps.queue.outputs.pending != '0'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: trace-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run queued jobs
        if: steps.queue.outputs.pending != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          docker run --rm \
            -e DATABASE_URL -e SECRET_KEY -e JWT_SECRET_KEY -e REDIS_URL \
            -e ENVIRONMENT=production -e SERVERLESS=false \
            -e EMBEDDING_PROVIDER=none -e MODEL_PROVIDER=none -e SCANNER_MEMORY_LIMIT_MB=3072 \
            trace-worker rq worker --burst --url "$REDIS_URL" trace > /dev/null 2>&1 \
            || { echo "::warning::worker exited with code $?"; exit 1; }
