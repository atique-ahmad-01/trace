# TRACE API on an Oracle Cloud Always Free Arm VM (Ampere A1: up to 2 OCPU / 12 GB RAM, no time limit).
# Picked from https://github.com/ripienaar/free-for-dev: the free container hosts there give 512 MB,
# too little for Semgrep and Trivy, and serverless hosts (Vercel) cannot run background scans.
#
# On the VM, from this directory:
#   cp .env.example .env      # fill in API_DOMAIN, DATABASE_URL, secrets
#   docker compose up -d --build
#
# Caddy terminates HTTPS (Let's Encrypt) for API_DOMAIN and proxies to the API. The API port is not
# published. Scans and agent jobs run in-process; a restart marks interrupted jobs as failed.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 512

services:
  api:
    build: ../../backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      SERVERLESS: "false"
      # No Ollama on the VM by default: retrieval runs keyword-only, and orgs connect a hosted
      # model in Settings -> Integrations.
      EMBEDDING_PROVIDER: none
      MODEL_PROVIDER: none
      SCANNER_MEMORY_LIMIT_MB: "3072"
      WORK_DIR: /app/storage/work
      QDRANT_PATH: /app/storage/qdrant
    volumes: [api_storage:/app/storage]
    expose: ["8000"]
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "2", memory: 8g }
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    <<: *hardening
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped

volumes:
  api_storage:
  caddy_data:
  caddy_config:
