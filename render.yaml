# Render Blueprint for the TRACE API (the Next.js frontend is deployed on Vercel).
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked `sync: false`
# are asked for when the Blueprint is created; never commit them.
#
# Model providers, GitHub tokens and Langfuse are not configured here: each organization
# connects them in Settings -> Integrations (env fallback is off in production).

databases:
  - name: trace-db
    plan: basic-256mb
    region: singapore
    databaseName: trace
    user: trace
    postgresMajorVersion: "16"

services:
  - type: web
    name: trace-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Starter (512 MB) runs the API, but real-repository scans (Semgrep, Trivy) need Standard (2 GB) or more.
    plan: starter
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Frontend origins: the Vercel production domains, plus its preview deployments.
      - key: CORS_ORIGINS
        value: https://trace-psi-gules.vercel.app,https://trace-atique-ahmad-chs-projects.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://trace(-[a-z0-9-]+)?-atique-ahmad-chs-projects\.vercel\.app$
      # No Ollama on Render: retrieval runs keyword-only, and orgs connect a hosted model in the UI.
      - key: EMBEDDING_PROVIDER
        value: none
      - key: MODEL_PROVIDER
        value: none
      - key: SCANNER_MEMORY_LIMIT_MB
        value: "1536"
      # Seeded admin and demo fixture. The password must be 12+ characters and not the default,
      # otherwise seeding is skipped in production.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: admin@trace.example
      - key: DEMO_ADMIN_PASSWORD
        sync: false
